  architecture_notes: |
    Die Komponente folgt dem klassischen Joomla-3-MVC-Muster mit strikter
    admin/site-Trennung und global gültigen (nicht-namespaced) Klassennamen
    nach dem Schema "AdvPortfolio<Typ><Entität>" (z.B. AdvPortfolioModelProject,
    AdvPortfolioViewProjects, AdvPortfolioControllerImageHandler). Views nutzen
    das klassische view.html.php + tmpl/*.php-Layoutmuster; Templates sind
    reines prozedurales PHP mit direkten Aufrufen von JHtml::_, JText::_ und
    JRoute::_.

    Für Joomla 6 (PSR-4/Namespaces seit Joomla 4) ergeben sich folgende
    strukturelle Verschiebungen:

    1. Alle Klassen wandern unter src/ in die Namespaces
       Joomla\Component\Advportfolio\Administrator\... bzw. ...\Site\...,
       mit Klassennamen wie ProjectModel, ProjectController, HtmlView
       (Klassenname ergibt sich aus dem Namespace/Ordnerpfad, Präfix
       "AdvPortfolio" entfällt).
    2. Alle *.tmpl-Layoutdateien bleiben prozedurales PHP, verbleiben aber
       außerhalb von src/ in unveränderten tmpl/-Ordnern (kein Autoloading
       für Layouts).
    3. admin/advportfolio.php und site/advportfolio.php (klassische
       Entry-Point-Dateien, die JControllerLegacy::getInstance() aufrufen)
       entfallen vollständig zugunsten von services/provider.php und
       src/.../Extension/AdvportfolioComponent.php (ComponentInterface,
       MVCFactory, RouterFactory, DI-Container).
    4. admin/helpers/factory.php (AdvPortfolioFactory) wird obsolet, da die
       MVCFactory-Registrierung diese Aufgabe im Service Provider übernimmt.
    5. site/helpers/route.php (statische Router-Hilfsfunktionen) verschmilzt
       mit site/router.php zu einem einzigen Router-Service, der
       RouterInterface implementiert.
    6. Alle index.html-Platzhalter zum Verzeichnisschutz sind mit
       PSR-4-Autoloading funktionslos und werden nicht migriert.
    7. Sprachdateien wandern aus dem Komponentenordner in die zentralen
       language/-Wurzelverzeichnisse (administrator/language/en-GB/,
       language/en-GB/).
    8. Medien-Assets (CSS/JS/Bilder) wandern unter media/com_advportfolio/
       gemäß dem Joomla-4+-Media-Manager-Schema.
    9. Alle verwendeten Legacy-Klassen (siehe global_dependencies) müssen
       durch ihre namespaced CMS-Pendants ersetzt werden, z.B.
       JFactory::getUser() -> Joomla\CMS\Factory::getApplication()->getIdentity(),
       JText::_() -> Joomla\CMS\Language\Text::_(),
       JHtml::_() -> Joomla\CMS\HTML\HTMLHelper::_(),
       JTable::getInstance() -> MVCFactory/Table-Service,
       JRoute::_() -> Joomla\CMS\Router\Route::_().
    10. Veraltete/entfernte APIs ohne direktes Pendant in Joomla 6 (JError,
        JRequest, JApplication, JArrayHelper, JString, JFileterInput-Tippfehler
        in admin/controller.php) erfordern manuelle Neuimplementierung, keine
        1:1-Ersetzung.

    Diese Matrix ist ausschließlich eine Planungsgrundlage; es wurde keine
    Migration durchgeführt.
